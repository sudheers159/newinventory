{% extends "base.html" %}{% block title %}{{title}}{% endblock %}{% block content %}
<h1>{{title}}</h1><br><form method="post" class="form">{% csrf_token %}
<div class="field"><label>Product Name</label><input name="name" required value="{{p.name|default:''}}"></div>
<div class="field"><label>SKU</label><input name="sku" required value="{{p.sku|default:''}}"></div>
<div class="field"><label>Category</label><select name="category"><option value="">-- None --</option>{% for c in categories %}<option value="{{c.id}}" {% if p.category_id == c.id %}selected{% endif %}>{{c.name}}</option>{% endfor %}</select></div>
<div class="field"><label>Purchase Price</label><input type="number" step="0.01" name="purchase_price" value="{{p.purchase_price|default:0}}"></div>
<div class="field"><label>Selling Price</label><input type="number" step="0.01" name="selling_price" value="{{p.selling_price|default:0}}"></div>
<div class="field"><label>Quantity</label><input type="number" name="quantity" min="0" value="{{p.quantity|default:0}}"></div>
<div class="field"><label>Low Stock Limit</label><input type="number" name="low_stock_limit" min="0" value="{{p.low_stock_limit|default:5}}"></div>
<button class="btn">Save Product</button></form>{% endblock %}
